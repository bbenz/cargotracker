name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-java@v6.0.1
      with:
        distribution: microsoft
        java-version: "21"
        cache: maven
    - name: Build and run offline tests
      run: mvn -B -Popenliberty test
