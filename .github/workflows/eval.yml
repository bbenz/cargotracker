name: Eval

on:
  pull_request:
    paths:
    - src/main/resources/prompts/**
    - src/main/ai-docs/**
    - src/main/java/org/eclipse/cargotracker/ai/**
    - src/test/resources/eval/**
    - k8s/ai-config.yaml
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-java@v6.0.1
      with:
        distribution: microsoft
        java-version: "21"
        cache: maven
    - name: Check eval secrets
      id: secrets
      env:
        AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
        AI_API_KEY: ${{ secrets.AI_API_KEY }}
      run: |
        if [ -z "$AI_BASE_URL" ] || [ -z "$AI_API_KEY" ]; then
          echo "::notice::AI_BASE_URL or AI_API_KEY is not set. Skipping eval tests."
          echo "run_eval=false" >> "$GITHUB_OUTPUT"
        else
          echo "run_eval=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Read the model settings from the Kubernetes config
      if: steps.secrets.outputs.run_eval == 'true'
      run: |
        echo "AI_CHAT_MODEL=$(yq '.data."chat-model"' k8s/ai-config.yaml)" >> "$GITHUB_ENV"
        echo "AI_API=$(yq '.data.api' k8s/ai-config.yaml)" >> "$GITHUB_ENV"
        echo "AI_REASONING_EFFORT=$(yq '.data."reasoning-effort"' k8s/ai-config.yaml)" >> "$GITHUB_ENV"
        echo "AI_TIMEOUT_SECONDS=$(yq '.data."timeout-seconds"' k8s/ai-config.yaml)" >> "$GITHUB_ENV"
    - name: Run eval tests
      if: steps.secrets.outputs.run_eval == 'true'
      env:
        AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
        AI_API_KEY: ${{ secrets.AI_API_KEY }}
        # Gates for gpt-6.1-sol. The defaults in the test match the talk: 4 seconds and 2,500 tokens.
        EVAL_P95_MILLIS: ${{ vars.EVAL_P95_MILLIS || '15000' }}
        EVAL_MAX_TOKENS: ${{ vars.EVAL_MAX_TOKENS || '3500' }}
      run: mvn -B -Popenliberty -Dtest=CargoAssistantEvalTest test
