# Jaeger stores traces in memory. That is enough for a demo, not for production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: cargo-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/jaeger:2.22.0
        ports:
        - name: ui
          containerPort: 16686
        - name: otlp-grpc
          containerPort: 4317
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: cargo-tracker
spec:
  selector:
    app: jaeger
  ports:
  - name: ui
    port: 16686
    targetPort: ui
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
